name: tutorial-screens

# Manually/push-triggered helper: shoots the real-app screenshots for the tutorial
# video and commits them to the branch. (Narration is now a human recording —
# see marketing/tutorial-video/voice-raw — so the TTS step was removed.)
on:
  workflow_dispatch:
  push:
    branches: ["claude/app-installation-tutorial-video-*"]
    paths:
      - "marketing/tutorial-video/shoot_screens.mjs"
      - ".github/workflows/tutorial-tts.yml"

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Screenshot the real app
        run: |
          npm init -y > /dev/null
          npm i playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium
          node marketing/tutorial-video/shoot_screens.mjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/tutorial-video/screens
          git commit -m "tutorial video: real app screenshots" || echo "nothing to commit"
          git push
