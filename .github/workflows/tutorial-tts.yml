name: tutorial-tts

# Manually/push-triggered helper: generates the Hebrew narration audio for the
# app tutorial video and real-app screenshots, then commits them to the branch.
on:
  workflow_dispatch:
  push:
    branches: ["claude/app-installation-tutorial-video-*"]
    paths:
      - "marketing/tutorial-video/narration.json"
      - "marketing/tutorial-video/generate_tts.py"
      - "marketing/tutorial-video/shoot_screens.mjs"
      - ".github/workflows/tutorial-tts.yml"

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.2.8
      - run: python marketing/tutorial-video/generate_tts.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Screenshot the real app
        run: |
          npm init -y > /dev/null
          npm i playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium
          node marketing/tutorial-video/shoot_screens.mjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/tutorial-video/audio marketing/tutorial-video/screens
          git commit -m "tutorial video: narration audio + real app screenshots" || echo "nothing to commit"
          git push
