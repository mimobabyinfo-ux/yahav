name: tutorial-transcribe

# One-off verification: transcribes the human voice-over takes so the build can
# confirm each file really belongs to the scene its filename claims (and which
# half of the split outro comes first). Writes voice-raw/transcript.txt.
on:
  workflow_dispatch:
  push:
    branches: ["claude/app-installation-tutorial-video-*"]
    paths:
      - "marketing/tutorial-video/voice-raw/**"
      - ".github/workflows/tutorial-transcribe.yml"

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper==1.1.0 requests
      - name: Transcribe takes
        run: |
          python - <<'EOF'
          import pathlib
          from faster_whisper import WhisperModel

          model = WhisperModel("small", device="cpu", compute_type="int8")
          out = []
          for p in sorted(pathlib.Path("marketing/tutorial-video/voice-raw").glob("*.m4a")):
              segs, info = model.transcribe(str(p), language="he", vad_filter=True)
              text = " ".join(s.text.strip() for s in segs)
              out.append(f"{p.name}\t{info.duration:.2f}s\t{text}")
              print(out[-1], flush=True)
          pathlib.Path("marketing/tutorial-video/voice-raw/transcript.txt").write_text(
              "\n".join(out) + "\n", encoding="utf-8")
          EOF
      - name: Commit transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/tutorial-video/voice-raw/transcript.txt
          git commit -m "tutorial video: transcript of the voice-over takes" || echo "nothing to commit"
          git push
